name: StoryLoom checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:io
      - run: npm run test:core
      - run: npm run build
      - run: npm run build:web
      - run: xvfb-run -a npm run test:app
      - run: xvfb-run -a npm run test:player-dom
      - run: xvfb-run -a npm run test:browser-recovery
      - run: xvfb-run -a npm run test:studio-app

  windows-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
      - run: npm run test:studio-app
