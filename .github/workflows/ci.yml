name: StoryLoom checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub 托管 runner 上 Electron 的 SUID sandbox 权限不对，会直接 SIGTRAP，先修正
      - name: Fix Electron SUID sandbox permissions
        run: sudo chown root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run typecheck
      - run: npm run test:io
      - run: npm run test:core
      - run: npm run build
      - run: npm run build:web
      - run: xvfb-run -a npm run test:app
      - run: xvfb-run -a npm run test:player-dom
      - run: xvfb-run -a npm run test:browser-recovery
      - run: xvfb-run -a npm run test:studio-app

  windows-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run build
      - run: npm run test:studio-app
